<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>The Strategy Desk · The Morning Brief</title>
<meta name="description" content="The Strategy Desk: 90-day backtest book for the live Nasdaq and gold strategies, the bench, and the retired, with a verdict on who could come back.">
<link rel="alternate" type="application/json" href="book.json" title="The Strategy Desk as structured data">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

</head>
<body>
<div class="viewport">

  <header class="masthead">
    <div class="masthead-ear">
      <span class="ear-note">&ldquo;Every strategy is innocent until its trade log testifies.&rdquo;</span>
      <a class="bar-cell wa-backlink" href="index.html">&larr; Front page &middot; The Morning Brief</a>
    </div>
    <h1 class="nameplate">The Strategy Desk</h1>
    <div class="masthead-bar">
      <span class="bar-cell">Analyst Column &mdash; MNQ &amp; MGC</span>
      <span class="dateline" id="ad-dateline">&nbsp;</span>
      <span class="bar-cell bar-right">Backtests, not brokers</span>
    </div>
    <div class="wa-genline" id="ad-genline">Setting type &mdash; pulling the trade logs&hellip;</div>
  </header>

  <!-- Drawn by assets/analyst.js from book.json (fetchers/book.py). Every
       figure is read from the TradingView List-of-Trades export named on the
       card. The prose verdicts are rule-based on those figures. Nothing here
       gates an account. -->
  <div id="ad-root">
    <p class="wa-note">Setting type &mdash; pulling the trade logs&hellip;</p>
  </div>

  <footer class="colophon">
    <div class="colophon-left"><span class="mono" id="ad-foot-left">book.v1</span></div>
    <span class="colophon-orn" aria-hidden="true">❦</span>
    <div class="colophon-right"><span class="mono" id="ad-foot-right">&nbsp;</span></div>
  </footer>

</div>
<script src="assets/analyst.js" defer></script>
</body>
</html>
